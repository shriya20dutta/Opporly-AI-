openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: opportunities
    description: AI opportunity matching
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /opportunities/analyze:
    post:
      operationId: analyzeOpportunities
      tags: [opportunities]
      summary: Analyze opportunity matches with AI
      description: Compares a user-provided profile with a set of opportunity listings. Listings and eligibility details are not externally verified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpportunityAnalysisInput"
      responses:
        "200":
          description: AI match analysis for each supplied opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityAnalysisResponse"
        "400":
          description: Invalid analysis request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: AI provider did not return a valid analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: AI analysis is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    OpportunityProfile:
      type: object
      properties:
        profileType:
          type: string
          enum: [student, professional]
        bio:
          type: string
          maxLength: 4000
        education:
          type: string
          maxLength: 1000
        profession:
          type: string
          maxLength: 1000
        skills:
          type: array
          maxItems: 40
          items:
            type: string
            maxLength: 120
        interests:
          type: array
          maxItems: 40
          items:
            type: string
            maxLength: 120
        achievements:
          type: array
          maxItems: 40
          items:
            type: string
            maxLength: 500
        locations:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 160
      required:
        - profileType
        - bio
        - education
        - profession
        - skills
        - interests
        - achievements
        - locations
    OpportunityCandidate:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 100
        title:
          type: string
          maxLength: 240
        organizer:
          type: string
          maxLength: 240
        category:
          type: string
          enum: [scholarship, event, competition, conference, hackathon, grant, professional-event]
        description:
          type: string
          maxLength: 4000
        eligibility:
          type: string
          maxLength: 2000
        benefits:
          type: string
          maxLength: 2000
        deadline:
          type: string
          maxLength: 80
        eventDate:
          type: string
          maxLength: 80
        format:
          type: string
          maxLength: 160
        locations:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 160
        interests:
          type: array
          maxItems: 40
          items:
            type: string
            maxLength: 120
        sourceUrl:
          type: string
          maxLength: 2048
      required:
        - id
        - title
        - organizer
        - category
        - description
        - eligibility
        - benefits
        - deadline
        - eventDate
        - format
        - locations
        - interests
        - sourceUrl
    OpportunityAnalysisInput:
      type: object
      properties:
        profile:
          $ref: "#/components/schemas/OpportunityProfile"
        opportunities:
          type: array
          minItems: 1
          maxItems: 30
          items:
            $ref: "#/components/schemas/OpportunityCandidate"
      required:
        - profile
        - opportunities
    OpportunityAnalysisResult:
      type: object
      properties:
        opportunityId:
          type: string
        matchPercentage:
          type: integer
          minimum: 0
          maximum: 100
        eligibilityStatus:
          type: string
          enum: [likely, possible, unlikely]
        matchSummary:
          type: string
          maxLength: 500
        eligibilityNotes:
          type: string
          maxLength: 1000
        benefitsSummary:
          type: string
          maxLength: 500
        matchReasons:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: string
            maxLength: 200
      required:
        - opportunityId
        - matchPercentage
        - eligibilityStatus
        - matchSummary
        - eligibilityNotes
        - benefitsSummary
        - matchReasons
    OpportunityAnalysisResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/OpportunityAnalysisResult"
      required:
        - results
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

